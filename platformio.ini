; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = ESP32 GPS Navigator
default_envs = ICENAV_BOARD

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
version = 0.3.3
revision = 01
monitor_speed = 115200
monitor_filters = 
  esp32_exception_decoder
extra_scripts = pre:prebuild.py
build_unflags =
  -std=gnu++11
  -std=c++11
  -std=gnu++14
  -std=c++14
build_flags =
  -O3
  -std=gnu++17
  -Wno-error=return-type
  -D LV_CONF_PATH="\"${PROJECT_DIR}/lib/lvgl/lv_conf.h\""
  -D CORE_DEBUG_LEVEL=0
  -D DISABLE_RADIO=1
  -D BAUDRATE=115200
  -D SHELLMINATOR_BUFF_LEN=70
  -D SHELLMINATOR_BUFF_DIM=70
  -D SHELLMINATOR_LOGO_COLOR=BLUE
  -D COMMANDER_MAX_COMMAND_SIZE=70
  -D WCLI_MAX_CMDS=12           # set n+1 of defined commands for CLI
  ; -D DISABLE_CLI_TELNET=1     # disable remote access via telnet. It needs CLI
  ; -D DISABLE_CLI=1            # removed CLI module. Config via Bluetooth only

lib_deps = 
  ; slashdevin/NeoGPS@4.2.9
  https://github.com/jgauchia/NeoGPS.git#43c47665f3f8a1b809d809d9f685b376edd40238
  ;https://github.com/lovyan03/LovyanGFX.git#3f78b70
  lovyan03/LovyanGFX@1.2.31
  lvgl/lvgl@9.5.0
  hpsaturn/EasyPreferences@0.1.4
  hpsaturn/ESP32 Wifi CLI@0.3.6 
  jpb10/SolarCalculator@2.0.2

[esp32_common]
extends = common
board_build.filesystem = littlefs
; Sized for the 16 MB boards; the 8 MB and 32 MB ones override it.
board_build.partitions = partitions/default_16MB.csv
custom_sdkconfig =
  CONFIG_FATFS_USE_FASTSEEK=y
  CONFIG_FATFS_FAST_SEEK_BUFFER_SIZE=65536
  CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000

[env:ICENAV_BOARD]
extends = esp32_common
board = icenav-esp32-s3

[env:TDECK_ESP32S3]
extends = esp32_common
board = T-Deck
build_flags = 
  ${common.build_flags}
  -DBATT_ADC_UNIT=1
  -DBATT_ADC_CHANNEL=3
  -DPOWER_SAVE
  -DAT6558D_GPS

[env:ELECROW_ESP32]
extends = esp32_common
board = elecrow-esp32-s3-n16r8v-terminal
build_flags =
  ${common.build_flags}
  -DBATT_ADC_UNIT=2
  -DBATT_ADC_CHANNEL=6
  -DPOWER_SAVE
  ;-DAT6558D_GPS
  ;-DCOMPASS_AUTO
  ;-DBME280

[env:MAKERF_ESP32S3]
extends = esp32_common
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = partitions/default_8MB.csv
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -DBATT_ADC_UNIT=1
  -DBATT_ADC_CHANNEL=3
  ;-DAT6558D_GPS
  ;-DIMU_MPU9250

[env:MAKERF_MA028IPST]
extends = esp32_common
board = makerfab-ma028ipst
board_build.variants_dir = boards/variants
lib_deps =
  ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -DSDMMC_1BIT
  -DCOMPASS_AUTO
  ; Flash via USB-UART (CH340). GPIO19/20 are reserved for GPS UART, not native USB.
  ;-DAT6558D_GPS
; FatFS fast-seek: CLMT in PSRAM for random access to the custom vector maps pack on SD.
; custom_sdkconfig is pioarduino-specific: generates sdkconfig.defaults and recompiles the IDF libs.
custom_sdkconfig =
  CONFIG_FATFS_USE_FASTSEEK=y
  CONFIG_FATFS_FAST_SEEK_BUFFER_SIZE=65536
  ; esp-modbus 2.1.3 asserts MAX_API_BLOCKING >= TIMEOUT (stock had TIMEOUT=10000, no MAX).
  CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000

[env:ESP32S3_N16R8]
extends = esp32_common
board = esp32-s3-devkitc-1-n16r8v
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ;-DADC1
  -DILI9341_NOTOUCH_SPI
  ;-DAT6558D_GPS
  ;-DCOMPASS_AUTO
  ;-DBME280
  -DSPI_SHARED

[env:T4_S3]
extends = esp32_common
board = T-Display-AMOLED
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_MODE=1
  -DPOWER_SAVE
  -DT4_S3
  -DARDUINO_USB_CDC_ON_BOOT=1
  ;-DCOMPASS_AUTO

[esp32p4_base]
extends = esp32_common
custom_sdkconfig =
  ${esp32_common.custom_sdkconfig}
  CONFIG_CACHE_L2_CACHE_128KB=n
  CONFIG_CACHE_L2_CACHE_256KB=y
  CONFIG_CACHE_L2_CACHE_LINE_64B=y
  CONFIG_CACHE_L2_CACHE_LINE_128B=n
custom_component_add =
  espressif/esp_hosted@2.12.8
  espressif/esp_wifi_remote@1.0.2
  espressif/wifi_remote_over_eppp@0.3.2

[env:WAVESHARE_P4_35]
extends = esp32p4_base
board = waveshare-esp32-p4-35
build_flags =
  ${common.build_flags}
  -DPOWER_SAVE
  -DINVERT_BOOT_PIN
  ; -DAT6558D_GPS
  ; -DBME280
  ; -DCOMPASS_AUTO
  ; -DMPU6050

[env:WAVESHARE_P4_43]
extends = esp32p4_base
board = waveshare-esp32-p4-43
board_build.partitions = partitions/default_32MB.csv
build_flags =
  ${common.build_flags}
  ; -DAT6558D_GPS
  ; -DBME280
  ; -DCOMPASS_AUTO
  ; -DMPU6050
  -DPOWER_SAVE
  -DBATT_ADC_UNIT=1
  -DBATT_ADC_CHANNEL=4
  -DBATT_DIVIDER_R1=200000
  -DBATT_DIVIDER_R2=100000
