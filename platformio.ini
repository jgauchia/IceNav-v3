; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = ESP32 GPS Navigator
default_envs = ICENAV_BOARD

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
version = 0.3.0
revision = 97
monitor_speed = 115200
;monitor_rts = 0
;monitor_dtr = 0
monitor_filters = 
  esp32_exception_decoder
extra_scripts = pre:prebuild.py
build_unflags =
  -std=gnu++11
  -std=c++11
  -std=gnu++14
  -std=c++14
build_flags =
  -O3
  -std=gnu++17
  -Wno-error=return-type
  -D LV_CONF_PATH="\"${PROJECT_DIR}/lib/lvgl/lv_conf.h\""
  -D CORE_DEBUG_LEVEL=5
  -D DISABLE_RADIO=1
  -D BAUDRATE=115200
  -D SHELLMINATOR_BUFF_LEN=70
  -D SHELLMINATOR_BUFF_DIM=70
  -D SHELLMINATOR_LOGO_COLOR=BLUE
  -D COMMANDER_MAX_COMMAND_SIZE=70
  -D WCLI_MAX_CMDS=12           # set n+1 of defined commands for CLI
  ; -D DISABLE_CLI_TELNET=1     # disable remote access via telnet. It needs CLI
  ; -D DISABLE_CLI=1            # removed CLI module. Config via Bluetooth only

lib_deps = 
  ; slashdevin/NeoGPS@4.2.9
  https://github.com/jgauchia/NeoGPS.git#43c47665f3f8a1b809d809d9f685b376edd40238
  ;https://github.com/lovyan03/LovyanGFX.git#7c8fd62
  lovyan03/LovyanGFX@1.2.24
  lvgl/lvgl@9.5.0
  hpsaturn/EasyPreferences@0.1.4
  hpsaturn/ESP32 Wifi CLI@0.3.5
  jpb10/SolarCalculator@2.0.2

[esp32_common]
extends = common

[env:ICENAV_BOARD]
;build_type = debug
extends = esp32_common
board = icenav-esp32-s3
lib_deps =
  ${common.lib_deps}
build_flags =
  ${common.build_flags}

[env:TDECK_ESP32S3]
extends = esp32_common
board = T-Deck
lib_deps =
  ${common.lib_deps}
build_flags = 
  ${common.build_flags}
  -DBATT_ADC_UNIT=1
  -DBATT_ADC_CHANNEL=3
  -DPOWER_SAVE
  -DAT6558D_GPS

[env:ELECROW_ESP32]
extends = esp32_common
board = elecrow-esp32-s3-n16r8v-terminal
lib_deps =
  ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DBATT_ADC_UNIT=2
  -DBATT_ADC_CHANNEL=6
  -DPOWER_SAVE
  ;-DAT6558D_GPS
  ;-DCOMPASS_AUTO
  ;-DBME280

[env:MAKERF_ESP32S3]
extends = esp32_common
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
lib_deps =
  ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -DBATT_ADC_UNIT=1
  -DBATT_ADC_CHANNEL=3
  ;-DAT6558D_GPS
  ;-DIMU_MPU9250

[env:ESP32S3_N16R8]
extends = esp32_common
board = esp32-s3-devkitc-1-n16r8v
board_build.partitions = default_16MB.csv
lib_deps =
  ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ;-DADC1
  -DILI9341_NOTOUCH_SPI
  ;-DAT6558D_GPS
  ;-DCOMPASS_AUTO
  ;-DBME280
  -DSPI_SHARED

[env:T4_S3]
extends = esp32_common
board = T-Display-AMOLED
board_build.partitions = default_16MB.csv
lib_deps =
  ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DPOWER_SAVE
  -DT4_S3
  -DARDUINO_USB_CDC_ON_BOOT=1
  ;-DCOMPASS_AUTO

[env:WAVESHARE_P4_35]
extends = esp32_common
board = waveshare-esp32-p4-35
; P4 uses LittleFS (SPIFFS images are not reliably recognized on this flash).
board_build.filesystem = littlefs
lib_deps =
  ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  ; -Wno-literal-suffix (C++ only) is added from prebuild.py for P4 to silence a
  ; warning from an Espressif P4 header (periph_ctrl.h), not our code.
  ; WiFi over the ESP32-C6 (ESP-Hosted, SDIO) and the CLI: pins verified
  ; against the Waveshare P4-3.5 schematic (ESP32-C6FH8 block).
  ; Power button (PWR_KEY, wired to the AXP2101 PMIC): pin verified against
  ; the schematic (PMIC block).
  -DPOWER_SAVE
  -DAT6558D_GPS
  -DBME280
  ; Compass chip (QMC5883L or HMC5883L) is auto-detected at runtime, see
  ; Compass::initShared() — no need to know which one is physically mounted.
  ; Named COMPASS_AUTO (not COMPASS) to avoid colliding with the COMPASS
  ; enumerator in lib/gui/src/mainScr.hpp's tile enum.
  -DCOMPASS_AUTO
  -DMPU6050

[env:WAVESHARE_P4_43]
extends = esp32_common
board = waveshare-esp32-p4-43
; P4 uses LittleFS (SPIFFS images are not reliably recognized on this flash).
board_build.filesystem = littlefs
lib_deps =
  ${common.lib_deps}
; With DISABLE_CLI the CLI libraries are unused; ignore them so their global
; WiFiServer/telnet objects (which touch the radio) are not linked. The P4 has
; no local radio yet (ESP-Hosted C6 comes later).
lib_ignore =
  ESP32 Wifi CLI
  Shellminator
  Commander-API
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  ; -Wno-literal-suffix (C++ only) is added from prebuild.py for P4 to silence a
  ; warning from an Espressif P4 header (periph_ctrl.h), not our code.
  ; RADIO_NONE and DISABLE_CLI are temporary: WiFi over the ESP32-C6 (ESP-Hosted)
  ; and the CLI are enabled later.
  -DRADIO_NONE
  -DDISABLE_CLI

