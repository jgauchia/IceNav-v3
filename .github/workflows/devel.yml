name: PlatformIO

on:
  pull_request:
    branches:
      - devel
    paths-ignore:
      - '**/README.md'

jobs:
  layer-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Layer 2/3 do not include Layer 0 headers
        run: ./tools/check_layer_discipline.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
          pio pkg update 
      - name: Testing ICENAV Custom Board
        run: |
          export ICENAV3_LON=13.404
          export ICENAV3_LAT=52.520
          pio run
      - name: Testing ESP32S3 T-Deck Board
        run: |
          export ICENAV3_LON=13.404
          export ICENAV3_LAT=52.520
          pio run -e TDECK_ESP32S3
 
