name: PlatformIO

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/README.md'

jobs:
  layer-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Layer 2/3 do not include Layer 0 headers
        run: ./tools/check_layer_discipline.sh

  build:
    name: Testing ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - ICENAV_BOARD
          - TDECK_ESP32S3
          - T4_S3
          - ELECROW_ESP32
          - WAVESHARE_P4_35
          - WAVESHARE_P4_43
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
      - name: Testing ${{ matrix.env }}
        run: |
          export ICENAV3_LON=13.404
          export ICENAV3_LAT=52.520
          pio run -e ${{ matrix.env }}