name: Schedule

on:
  schedule:
    - cron:  '30 10 * * 3'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-6.2.0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pioarduino==6.2.0
          pio pkg install -g -t "platformio/tool-scons@4.41101.0"
      - name: Pin pioarduino for penv (uv constraint)
        run: |
          echo "pioarduino==6.2.0" > pio-constraints.txt
          echo "UV_CONSTRAINT=$(pwd)/pio-constraints.txt" >> "$GITHUB_ENV"
      - name: Testing ICENAV Custom Board
        run: |
          export ICENAV3_LON=13.404
          export ICENAV3_LAT=52.520
          pio run
      - name: Testing ESP32S3 MakerFabs Board
        run: |
          export ICENAV3_LON=13.404
          export ICENAV3_LAT=52.520
          pio run -e MAKERF_ESP32S3
      - name: Testing ESP32S3 T-Deck Board
        run: |
          export ICENAV3_LON=13.404
          export ICENAV3_LAT=52.520
          pio run -e TDECK_ESP32S3
 

 

