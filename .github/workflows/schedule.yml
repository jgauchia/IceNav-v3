name: Schedule

on:
  schedule:
    - cron:  '30 10 * * 3'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-6.2.0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          # pioarduino 6.2.0.post1 (2026-10-26) reports "6.2.0-post.1", which the platform's
          # semver check reads as a prerelease of 6.2.0 and rejects with IncompatiblePlatform.
          # Pin 6.2.0 in the penv: that is the interpreter running pio, and the platform
          # installs its own dependencies there.
          python -m venv $HOME/.platformio/penv
          $HOME/.platformio/penv/bin/python -m pip install pioarduino==6.2.0
          echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"
      - name: Testing ICENAV Custom Board
        run: |
          export ICENAV3_LON=13.404
          export ICENAV3_LAT=52.520
          pio run
      - name: Testing ESP32S3 MakerFabs Board
        run: |
          export ICENAV3_LON=13.404
          export ICENAV3_LAT=52.520
          pio run -e MAKERF_ESP32S3
      - name: Testing ESP32S3 T-Deck Board
        run: |
          export ICENAV3_LON=13.404
          export ICENAV3_LAT=52.520
          pio run -e TDECK_ESP32S3
 

 

